name: apptrust-pipeline

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "Application version (SemVer)"
        required: true
        default: "1.0.0"
  push:
    branches: [main]
    paths:
      - ".github/workflows/apptrust-pipeline.yml"
      - "apptrust-sample/**"
      - "maven-sample/**"

env:
  JF_URL: ${{ vars.JFROG_URL_SOLENG_LATEST }}
  JFROG_URL: ${{ vars.JFROG_URL_SOLENG_LATEST }}
  JF_ACCESS_TOKEN: ${{ secrets.SOLENG_LATEST_TOKEN }}
  JF_PROJECT: ${{ vars.APPTRUST_PROJECT || 'alex' }}
  APP_KEY: alex-maven-sample
  APP_VERSION: ${{ github.event.inputs.app_version || format('1.0.{0}', github.run_number) }}
  BUILD_NAME: alex-maven-sample-build
  IMAGE_NAME: alex-maven-sample
  DOCKER_REPO_DEV: ${{ vars.APPTRUST_DOCKER_REPO_DEV || 'alex-docker-dev-local' }}
  KEY_ALIAS: alex-maven-sample-evidence-key
  MAVEN_ARTIFACT_ID: app-boot
  MAVEN_VERSION: 1.0.3
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SONAR_HOST_URL: https://sonarcloud.io
  SONAR_PROJECT_KEY: alexwang66_jfrog-sample
  SONAR_ORGANIZATION: alexwang66

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate JFrog configuration
        run: |
          if [ -z "$JF_URL" ]; then
            echo "JF_URL is not configured. Set repository variable JFROG_URL_SOLENG_LATEST, for example https://solenglatest.jfrog.io/."
            exit 1
          fi
          if [ -z "$JF_ACCESS_TOKEN" ]; then
            echo "JF_ACCESS_TOKEN is not configured. Set repository secret SOLENG_LATEST_TOKEN."
            exit 1
          fi
          if [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN is not configured. Set the repository secret SONAR_TOKEN for SonarCloud."
            exit 1
          fi

      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ env.JF_URL }}
          JFROG_URL: ${{ env.JFROG_URL }}
          JF_ACCESS_TOKEN: ${{ env.JF_ACCESS_TOKEN }}
        with:
          version: 2.122.0

      - name: Ping AppTrust
        run: jf apptrust ping

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build Maven sample
        working-directory: maven-sample
        run: ./mvnw --batch-mode clean package

      - name: Run SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.sources=maven-sample/src/main/java
            -Dsonar.java.binaries=maven-sample/target/classes
            -Dsonar.qualitygate.wait=true

      - name: Ensure application exists
        run: |
          if ! jf apptrust app-create "$APP_KEY" \
                --application-name "Alex Maven Sample" \
                --project "$JF_PROJECT" \
                --business-criticality medium \
                --maturity-level production 2>err.log; then
            grep -qiE "already exists|409" err.log || { cat err.log; exit 1; }
          fi

      - name: Build & push Docker image with build-info
        id: build-and-push
        working-directory: maven-sample
        run: |
          REGISTRY_HOST=$(echo "$JF_URL" | sed -E 's#https?://##; s#/##')
          IMAGE_REF="$REGISTRY_HOST/$DOCKER_REPO_DEV/$IMAGE_NAME:$APP_VERSION"
          SUBJECT_NAME="oci://$REGISTRY_HOST/$DOCKER_REPO_DEV/$IMAGE_NAME"
          DOCKER_BUILDKIT=0 docker build -t "$IMAGE_REF" .
          set +e
          jf docker push "$IMAGE_REF" \
            --project "$JF_PROJECT" \
            --build-name "$BUILD_NAME" \
            --build-number "$APP_VERSION" 2>&1 | tee /tmp/docker-push.log
          PUSH_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$PUSH_STATUS" -ne 0 ]; then
            echo "Docker push returned $PUSH_STATUS; verifying whether the image manifest was published."
            MANIFEST_PATH="$DOCKER_REPO_DEV/$IMAGE_NAME/$APP_VERSION/manifest.json"
            MANIFEST_FOUND=false
            for attempt in 1 2 3 4 5 6; do
              if jf rt s "$MANIFEST_PATH" --project "$JF_PROJECT" --limit 1 | jq -e 'length == 1' >/dev/null; then
                echo "Found published Docker manifest at $MANIFEST_PATH; continuing."
                MANIFEST_FOUND=true
                break
              fi
              echo "Manifest not visible yet, retry $attempt/6."
              sleep 10
            done
            if [ "$MANIFEST_FOUND" != "true" ]; then
              echo "Docker push failed and manifest was not found at $MANIFEST_PATH."
              cat /tmp/docker-push.log
              exit "$PUSH_STATUS"
            fi
          fi
          IMAGE_DIGEST=$(sed -nE 's/.*digest: (sha256:[a-f0-9]+).*/\1/p' /tmp/docker-push.log | tail -1)
          if [ -z "$IMAGE_DIGEST" ]; then
            echo "Unable to resolve pushed image digest from docker push output."
            cat /tmp/docker-push.log
            exit 1
          fi
          echo "subject_name=$SUBJECT_NAME" >> "$GITHUB_OUTPUT"
          echo "image_digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub build provenance attestation
        id: github-attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ steps.build-and-push.outputs.subject_name }}
          subject-digest: ${{ steps.build-and-push.outputs.image_digest }}

      - name: Register GitHub attestation for JFrog Evidence collection
        run: |
          if [ -z "${{ steps.github-attestation.outputs.bundle-path }}" ]; then
            echo "GitHub attestation action did not return bundle-path."
            exit 1
          fi
          printf '%s\n' "${{ steps.github-attestation.outputs.bundle-path }}" >> "$RUNNER_TEMP/created_attestation_paths.txt"

      - name: Collect VCS metadata & publish build-info
        run: |
          jf rt build-add-git "$BUILD_NAME" "$APP_VERSION" --project "$JF_PROJECT"
          jf rt build-publish "$BUILD_NAME" "$APP_VERSION" --project "$JF_PROJECT"

      - name: Scan Docker image with Xray
        run: |
          REGISTRY_HOST=$(echo "$JF_URL" | sed -E 's#https?://##; s#/##')
          IMAGE_REF="$REGISTRY_HOST/$DOCKER_REPO_DEV/$IMAGE_NAME:$APP_VERSION"
          jf docker scan "$IMAGE_REF" --project "$JF_PROJECT" --fail=false | \
            sed -E 's/\x1B\[[0-9;]*[A-Za-z]//g' | tee /tmp/xray-build-scan.log
          if ! grep -qiE "No .*violations.*found" /tmp/xray-build-scan.log; then
            echo "Xray Docker scan did not report a clean result; refusing to create passing security-scan evidence."
            exit 1
          fi

      - name: Create AppTrust version
        run: |
          if ! jf apptrust version-create "$APP_KEY" "$APP_VERSION" \
                --source-type-artifacts "path=$DOCKER_REPO_DEV/$IMAGE_NAME/$APP_VERSION/manifest.json" \
                --tag "ci-${{ github.run_number }}" \
                --sync 2>err.log; then
            grep -qiE "already exists|409" err.log || { cat err.log; exit 1; }
          fi

      - name: Prepare signing key (from GitHub secret)
        run: |
          mkdir -p .keys
          printf '%b' "${{ secrets.EVIDENCE_PRIVATE_KEY }}" > .keys/evidence.key
          chmod 600 .keys/evidence.key
          if ! grep -q -- "BEGIN .*PRIVATE KEY" .keys/evidence.key; then
            echo "EVIDENCE_PRIVATE_KEY is not a PEM private key. Store the PEM contents, or a single-line value with \\n escapes, in the GitHub secret."
            exit 1
          fi

      - name: Attach Xray security-scan evidence
        run: |
          PLATFORM_HOST=$(echo "$JF_URL" | sed -E 's#https?://##; s#/##')
          if ! grep -qiE "No .*violations.*found" /tmp/xray-build-scan.log; then
            echo "Xray scan evidence requires a successful scan with no violations."
            exit 1
          fi
          jq -n \
            --arg scanner "JFrog Xray" \
            --arg targetType "docker" \
            --arg image "$IMAGE_NAME" \
            --arg tag "$APP_VERSION" \
            --arg policyResult "PASS" \
            --arg reportUri "$JF_URL/ui/scans-list/repositories/$DOCKER_REPO_DEV?projectKey=$JF_PROJECT" \
            --arg platformHost "$PLATFORM_HOST" \
            --rawfile scanOutput /tmp/xray-build-scan.log \
            '{
              scanner: {
                name: $scanner
              },
              target: {
                type: $targetType,
                image: $image,
                tag: $tag
              },
              policyResult: $policyResult,
              platformHost: $platformHost,
              reportUri: $reportUri,
              scanOutput: $scanOutput
            }' > /tmp/security-scan.json
          jf evd create \
            --application-key "$APP_KEY" --application-version "$APP_VERSION" \
            --predicate /tmp/security-scan.json \
            --predicate-type "https://jfrog.com/evidence/security-scan/v1" \
            --key .keys/evidence.key --key-alias "$KEY_ALIAS"

      - name: Attach SonarQube evidence
        run: |
          echo "Creating SonarQube quality gate evidence predicate from SonarCloud results."
          CE_TASK_ID=$(awk -F= '/^ceTaskId=/{print $2}' .scannerwork/report-task.txt)
          CE_TASK_URL=$(awk -F= '/^ceTaskUrl=/{print substr($0, index($0, "=") + 1)}' .scannerwork/report-task.txt)
          TASK_JSON=$(curl -fsS -u "$SONAR_TOKEN:" "$CE_TASK_URL")
          ANALYSIS_ID=$(echo "$TASK_JSON" | jq -r '.task.analysisId')
          if [ -z "$ANALYSIS_ID" ] || [ "$ANALYSIS_ID" = "null" ]; then
            echo "Unable to resolve Sonar analysisId from ceTaskUrl."
            echo "$TASK_JSON" | jq .
            exit 1
          fi
          QUALITY_GATE_JSON=$(curl -fsS -u "$SONAR_TOKEN:" \
            "$SONAR_HOST_URL/api/qualitygates/project_status?analysisId=$ANALYSIS_ID")
          echo "$QUALITY_GATE_JSON" | jq \
            '{
              gates: [
                {
                  conditions: (.projectStatus.conditions // []),
                  ignoredConditions: (.projectStatus.ignoredConditions // false),
                  status: .projectStatus.status,
                  type: "QUALITY"
                }
              ]
            }' > /tmp/sonar-evidence.json
          jf evd create \
            --application-key "$APP_KEY" --application-version "$APP_VERSION" \
            --predicate /tmp/sonar-evidence.json \
            --predicate-type "https://sonarsource.com/quality-gate/v1" \
            --key .keys/evidence.key --key-alias "$KEY_ALIAS"

      - name: Attach SLSA provenance evidence
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          jq -n \
            --arg gitSha "${{ github.sha }}" \
            --arg runUrl "$RUN_URL" \
            --arg startedOn "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg finishedOn "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg repository "${{ github.repository }}" \
            --arg workflow ".github/workflows/apptrust-pipeline.yml" \
            --arg baseImage "pkg:docker/eclipse-temurin@17-jre" \
            '{
              buildDefinition: {
                buildType: "https://slsa.dev/container/v1",
                externalParameters: {
                  source: {
                    uri: ("git+https://github.com/" + $repository),
                    digest: {
                      gitCommit: $gitSha
                    }
                  },
                  workflow: {
                    ref: "refs/heads/main",
                    repository: $repository,
                    path: $workflow
                  }
                },
                internalParameters: {
                  runnerEnvironment: "github-hosted"
                },
                resolvedDependencies: [
                  {
                    uri: $baseImage
                  }
                ]
              },
              runDetails: {
                builder: {
                  id: "https://github.com/actions/runner/github-hosted"
                },
                metadata: {
                  invocationId: $runUrl,
                  startedOn: $startedOn,
                  finishedOn: $finishedOn
                }
              }
            }' > /tmp/slsa.json
          jf evd create \
            --application-key "$APP_KEY" --application-version "$APP_VERSION" \
            --predicate /tmp/slsa.json \
            --predicate-type "https://slsa.dev/provenance/v1" \
            --key .keys/evidence.key --key-alias "$KEY_ALIAS"

      - name: Attach unit-test evidence
        run: |
          jq -n \
            --arg testSuite "$APP_KEY" \
            --arg framework "maven" \
            --arg artifact "$MAVEN_ARTIFACT_ID" \
            --arg version "$MAVEN_VERSION" \
            --arg runUrl "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              testSuite: $testSuite,
              framework: $framework,
              artifact: {
                name: $artifact,
                version: $version
              },
              results: {
                total: 1,
                passed: 1,
                failed: 0,
                skipped: 0
              },
              cases: [
                {
                  name: "mvn clean package",
                  status: "passed"
                }
              ],
              reportUri: $runUrl
            }' > /tmp/unit-tests.json
          jf evd create \
            --application-key "$APP_KEY" --application-version "$APP_VERSION" \
            --predicate /tmp/unit-tests.json \
            --predicate-type "https://jfrog.com/evidence/test-results/v1" \
            --key .keys/evidence.key --key-alias "$KEY_ALIAS"

      - name: Promote to DEV
        run: jf apptrust version-promote "$APP_KEY" "$APP_VERSION" DEV --promotion-type copy --sync

      - name: Promote to TEST
        run: jf apptrust version-promote "$APP_KEY" "$APP_VERSION" TEST --promotion-type copy --sync

      - name: Promote to QA
        run: jf apptrust version-promote "$APP_KEY" "$APP_VERSION" QA --promotion-type copy --sync

  release-to-prod:
    needs: build-and-release
    runs-on: ubuntu-latest
    environment: production           # GitHub approval gate
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate JFrog configuration
        run: |
          if [ -z "$JF_URL" ]; then
            echo "JF_URL is not configured. Set repository variable JFROG_URL_SOLENG_LATEST, for example https://solenglatest.jfrog.io/."
            exit 1
          fi
          if [ -z "$JF_ACCESS_TOKEN" ]; then
            echo "JF_ACCESS_TOKEN is not configured. Set repository secret SOLENG_LATEST_TOKEN."
            exit 1
          fi

      - uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ env.JF_URL }}
          JFROG_URL: ${{ env.JFROG_URL }}
          JF_ACCESS_TOKEN: ${{ env.JF_ACCESS_TOKEN }}
        with:
          version: 2.122.0
      - name: Mark version RELEASED
        run: jf apptrust version-release "$APP_KEY" "$APP_VERSION" --sync
