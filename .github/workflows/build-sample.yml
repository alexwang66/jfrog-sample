name: Build And Deploy Runtime Sample

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/build-sample.yml"
      - "maven-sample/**"
      - "runtime-sample/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - ".github/workflows/build-sample.yml"
      - "maven-sample/**"
      - "runtime-sample/**"
  workflow_dispatch:

env:
  SERVER_ID: soleng
  MAVEN_VIRTUAL_REPO: alex-maven-virtual
  DOCKER_REPO: docker-local
  IMAGE_NAME: runtime-sample-maven
  BUILD_NAME: Runtime-Maven-Sample-Build
  K8S_NAMESPACE: default
  K8S_POD_NAME: runtime-sample-maven
  IMAGE_PULL_SECRET: jfrog-docker-config

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      JFROG_URL: ${{ vars.JFROG_URL }}
      IMAGE_REGISTRY: ${{ vars.JFROG_DOCKER_REGISTRY || 'demo.jfrogchina.com' }}
      IMAGE_TAG: ${{ github.run_number }}-${{ github.sha }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JFROG_URL: ${{ vars.JFROG_URL }}
        with:
          oidc-provider-name: alexwang-github

      - name: Configure JFrog CLI
        run: |
          jf c add "$SERVER_ID" \
            --url="${{ vars.JFROG_URL }}" \
            --access-token="${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}" \
            --interactive=false \
            --overwrite=true
          jf c use "$SERVER_ID"
          jf rt ping --server-id "$SERVER_ID"

      - name: Configure Maven With Artifactory
        run: |
          jf mvnc \
            --repo-resolve-releases="$MAVEN_VIRTUAL_REPO" \
            --repo-resolve-snapshots="$MAVEN_VIRTUAL_REPO" \
            --repo-deploy-releases="$MAVEN_VIRTUAL_REPO" \
            --repo-deploy-snapshots="$MAVEN_VIRTUAL_REPO" \
            --server-id-resolve="$SERVER_ID" \
            --server-id-deploy="$SERVER_ID"

      - name: Build Maven Project
        working-directory: ./maven-sample
        run: |
          jf rt mvn clean package \
            --build-name="$BUILD_NAME" \
            --build-number="${{ github.run_id }}"

      - name: Publish Maven Build Info
        run: |
          jf rt build-publish "$BUILD_NAME" "${{ github.run_id }}"
          jf bs "$BUILD_NAME" "${{ github.run_id }}" --fail=false || true

      - name: Login To JFrog Docker Registry
        run: |
          jf docker login "$IMAGE_REGISTRY" --server-id "$SERVER_ID"

      - name: Build And Push Runtime Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runtime-sample/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.DOCKER_REPO }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_REGISTRY }}/${{ env.DOCKER_REPO }}/${{ env.IMAGE_NAME }}:latest-amd64

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure Kubernetes
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.RUNTIME_KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl config current-context

      - name: Configure Kubernetes Image Pull Secret
        run: |
          kubectl create secret docker-registry "$IMAGE_PULL_SECRET" \
            --namespace "$K8S_NAMESPACE" \
            --docker-server="$IMAGE_REGISTRY" \
            --docker-username="${{ vars.JFROG_DOCKER_USERNAME || 'alexwang' }}" \
            --docker-password="${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Deploy Runtime Pod
        run: |
          IMAGE="$IMAGE_REGISTRY/$DOCKER_REPO/$IMAGE_NAME:$IMAGE_TAG"
          kubectl delete pod "$K8S_POD_NAME" --namespace "$K8S_NAMESPACE" --ignore-not-found=true
          sed "s#demo.jfrogchina.com/docker-local/runtime-sample-maven:1.0.3-amd64#$IMAGE#g" runtime-sample/pod.yaml \
            | kubectl apply --namespace "$K8S_NAMESPACE" -f -
          kubectl wait --for=condition=Ready "pod/$K8S_POD_NAME" --namespace "$K8S_NAMESPACE" --timeout=180s
          kubectl get pod "$K8S_POD_NAME" --namespace "$K8S_NAMESPACE" -o wide

      - name: Build Summary
        if: always()
        run: |
          IMAGE="$IMAGE_REGISTRY/$DOCKER_REPO/$IMAGE_NAME:$IMAGE_TAG"
          echo "### Runtime Maven Sample" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build Info: ${{ vars.JFROG_URL }}/ui/builds/$BUILD_NAME/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Kubernetes Pod: \`$K8S_NAMESPACE/$K8S_POD_NAME\`" >> "$GITHUB_STEP_SUMMARY"
