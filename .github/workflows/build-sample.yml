name: Build Sample

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
env:
  NUGET_REPO_NAME: "alex-nuget"
  SERVER_ID: soleng
  MAVEN_VIRTUAL_REPO: "alex-maven-virtual"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Used by jfrog/setup-jfrog-cli (OIDC) and all jf commands below
      JFROG_URL: ${{ vars.JFROG_URL }}
      # Enable JFrog CLI Package Alias (Ghost Frog): native npm/go commands are
      # transparently routed through JFrog CLI (jf npm/jf go) for Artifactory
      # resolution + build-info. https://docs.jfrog.com/artifactory/docs/jfrog-cli-package-alias
      JFROG_CLI_GHOST_FROG: "true"

    steps:
    # Checkout Code
    - name: Checkout Code
      uses: actions/checkout@v4

    # set up.NET SDK
    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.x 

    # This action sets up the JFrog CLI with the Artifactory URL and access token     
    # - uses: jfrog/setup-jfrog-cli@v4
    #   env:
    #     JFROG_URL: ${{ vars.JFROG_URL }}
    #     JF_ACCESS_TOKEN: ${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}

    - uses: jfrog/setup-jfrog-cli@v4
      env:
        JFROG_URL: ${{ vars.JFROG_URL }}
      with:
        oidc-provider-name: alexwang-github
          
    # This command adds a new server configuration to the JFrog CLI, as an alternative for using the setup-jfrog-cli action    
    - run: |
        export SERVER_ID="soleng"
        # export NUGET_REPO_NAME="alex-nuget"
        jf c add $SERVER_ID --url=${{ vars.JFROG_URL}} --access-token=${{ secrets.ARTIFACTORY_ACCESS_TOKEN }} --interactive=false
        jf c use $SERVER_ID
        jf c show
        jf rt ping
        jf dotnetc --repo-resolve="${{ env.NUGET_REPO_NAME }}"  --server-id-resolve=$SERVER_ID

    # Install JFrog CLI Package Alias (Ghost Frog) for npm & go.
    # Creates ~/.jfrog/package-alias/bin/{npm,go} symlinks to `jf`. Each npm/go
    # build step below prepends this dir to PATH so the native command is
    # intercepted and run as `jf npm`/`jf go` (JFROG_CLI_GHOST_FROG=true).
    - name: Install JFrog CLI Package Alias (Ghost Frog)
      run: |
        jf package-alias install --packages=npm,go
        jf package-alias status

    # Restore Dependencies from Artifactory
    - name: Restore Dependencies from Artifactory
      run: |
        jf rt dotnet restore dotnet-sample/dotnet-sample.sln \
          --build-name="DotNet-Sample-Build" \
          --build-number="${{ github.run_id }}"
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: 1

    # Build Project
    - name: Build Project
      run: |
        jf rt dotnet build dotnet-sample/dotnet-sample.sln \
          --no-restore \
          --build-name="DotNet-Sample-Build" \
          --build-number="${{ github.run_id }}"
        
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: 1

    # Run Tests
    - name: Run Tests
      run: dotnet test dotnet-sample/dotnet-sample.sln --no-build

    # Publish Artifacts
    - name: Publish Artifacts
      run: |
        dotnet publish dotnet-sample/dotnet-sample.sln \
          --output ./output
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: 1

    # Upload Artifacts to Artifactory
    - name: Upload Artifacts to Artifactory
      run: |
        jf rt u "dotnet-sample/bin/Release/*.nupkg" \
          "${{ env.NUGET_REPO_NAME }}/dotnet-sample" \
          --build-name="DotNet-Sample-Build" \
          --build-number="${{ github.run_id }}"
    # Publish Build Info to Artifactory
    - name: Publish Build Info to Artifactory
      run: |
        jf rt build-publish "DotNet-Sample-Build" "${{ github.run_id }}"
        jf bs DotNet-Sample-Build "${{ github.run_id }}"   --fail=false

    # Go Project Build
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21.x'

    - name: Build Go Project (native `go` via Ghost Frog alias)
      working-directory: ./go-sample
      env:
        # Native commands can't take --build-name/--build-number, so pass them via env
        JFROG_CLI_BUILD_NAME: Go-Sample-Build
        JFROG_CLI_BUILD_NUMBER: ${{ github.run_id }}
      run: |
        jf goc --repo-resolve="alex-go" --server-id-resolve=$SERVER_ID
        # Activate the Ghost Frog alias for this shell, then run the NATIVE command.
        # `go` -> jf; with JFROG_CLI_GHOST_FROG=true this runs `jf go build` under the hood.
        export PATH="$HOME/.jfrog/package-alias/bin:$PATH"
        hash -r
        go build main.go

    - name: Publish Go Build Info to Artifactory
      run: |
        jf rt build-publish "Go-Sample-Build" "${{ github.run_id }}"
        jf bs Go-Sample-Build "${{ github.run_id }}" --fail=false

    # Build Summary
    - name: Build Summary
      if: always()
      run: |
        echo "### 🟦 DotNet Build" >> $GITHUB_STEP_SUMMARY
        echo "- [Artifacts in Artifactory](${{ vars.JFROG_URL }}/ui/repos/tree/General/${{ env.NUGET_REPO_NAME }}/dotnet-sample)" >> $GITHUB_STEP_SUMMARY
        echo "- [Build Info](${{ vars.JFROG_URL }}/ui/builds/DotNet-Sample-Build/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        echo "### 🟨 Go Build" >> $GITHUB_STEP_SUMMARY
        echo "- [Artifacts in Artifactory](${{ vars.JFROG_URL }}/ui/repos/tree/General/alex-go/github.com/jfrog-poc-samples/go-sample)" >> $GITHUB_STEP_SUMMARY
        echo "- [Build Info](${{ vars.JFROG_URL }}/ui/builds/Go-Sample-Build/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        echo "### 🟧 NPM Build" >> $GITHUB_STEP_SUMMARY
        echo "- [Artifacts in Artifactory](${{ vars.JFROG_URL }}/ui/repos/tree/General/alex-npm/npm-sample)" >> $GITHUB_STEP_SUMMARY
        echo "- [Build Info](${{ vars.JFROG_URL }}/ui/builds/NPM-Sample-Build/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        echo "### 🟩 Gradle Android Build" >> $GITHUB_STEP_SUMMARY
        echo "- [Build Info](${{ vars.JFROG_URL }}/ui/builds/Gradle-Android-Sample-Build/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
        
    # Setup Java for Maven
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # Setup Android SDK (required for Gradle Android build)
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android SDK packages
      run: |
        yes | sdkmanager --licenses
        sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

    - name: Configure Gradle with JFrog CLI
      working-directory: ./gradle-android-sample
      run: |
        jf gradle-config \
          --repo-resolve="${{ env.MAVEN_VIRTUAL_REPO }}" \
          --server-id-resolve=$SERVER_ID \
          --repo-deploy="${{ env.MAVEN_VIRTUAL_REPO }}" \
          --server-id-deploy=$SERVER_ID \
          --use-wrapper=true \
          --uses-plugin=true

    - name: Build Gradle Android Project and publish artifacts
      working-directory: ./gradle-android-sample
      run: |
        jf gradle clean assembleRelease artifactoryPublish \
          --build-name="Gradle-Android-Sample-Build" \
          --build-number="${{ github.run_id }}"

    - name: Publish Gradle Android Build Info to Artifactory
      run: |
        jf rt build-publish "Gradle-Android-Sample-Build" "${{ github.run_id }}"
        jf bs Gradle-Android-Sample-Build "${{ github.run_id }}" --fail=false

    # Configure Maven to use Artifactory
    - name: Configure Maven with JFrog CLI
      run: |
        jf mvnc --repo-resolve-releases="alex-maven-virtual" \
                --repo-resolve-snapshots="alex-maven-virtual" \
                --repo-deploy-releases="alex-maven-virtual" \
                --repo-deploy-snapshots="alex-maven-virtual" \
                --server-id-resolve=$SERVER_ID \
                --server-id-deploy=$SERVER_ID

    # Build Maven Project and deploy artifacts
    - name: Build Maven Project
      working-directory: ./maven-sample
      run: |
        jf rt mvn install \
          --build-name="Maven-Sample-Build" \
          --build-number="${{ github.run_id }}"

    # Publish Maven Build Info to Artifactory
    - name: Publish Maven Build Info to Artifactory
      run: |
        jf rt build-publish "Maven-Sample-Build" "${{ github.run_id }}"
        jf bs Maven-Sample-Build "${{ github.run_id }}" --fail=false

    # Setup Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    # Install Dependencies and Run Build
    - name: Install NPM Dependencies (native `npm` via Ghost Frog alias)
      working-directory: ./npm-sample
      env:
        JFROG_CLI_BUILD_NAME: NPM-Sample-Build
        JFROG_CLI_BUILD_NUMBER: ${{ github.run_id }}
      run: |
        jf npm-config --repo-resolve=alex-npm-virtual --repo-deploy=alex-npm-virtual --server-id-resolve=$SERVER_ID
        # Activate the Ghost Frog alias, then run the NATIVE command.
        # `npm` -> jf; with JFROG_CLI_GHOST_FROG=true this runs `jf npm install` under the hood.
        export PATH="$HOME/.jfrog/package-alias/bin:$PATH"
        hash -r
        npm install

    # Publish to Artifactory NPM Repo
    - name: Publish NPM Package (native `npm` via Ghost Frog alias)
      working-directory: ./npm-sample
      env:
        JFROG_CLI_BUILD_NAME: NPM-Sample-Build
        JFROG_CLI_BUILD_NUMBER: ${{ github.run_id }}
      run: |
        # `npm` -> jf; with JFROG_CLI_GHOST_FROG=true this runs `jf npm publish` under the hood.
        export PATH="$HOME/.jfrog/package-alias/bin:$PATH"
        hash -r
        npm publish

    # Publish NPM Build Info
    - name: Publish NPM Build Info to Artifactory
      run: |
        jf rt build-publish "NPM-Sample-Build" "${{ github.run_id }}"
        jf bs NPM-Sample-Build "${{ github.run_id }}" --fail=false
